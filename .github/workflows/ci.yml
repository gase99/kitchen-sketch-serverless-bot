name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is tested by deploy.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle check (no upload)
        run: npx wrangler deploy --dry-run --outdir dist
