# Cloudflare Workers configuration — https://developers.cloudflare.com/workers/wrangler/configuration/
name = "kitchen-sketch-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# Conversation state + rendered drawings.
# `wrangler dev` uses a local simulated KV, so the placeholder id is fine for local work.
# In CI, scripts/ensure-kv.mjs creates the namespace (if missing) and injects its real id.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
VISION_PROVIDER = "gemini"          # "gemini" | "openai"
GEMINI_MODEL = "gemini-2.5-flash"
OPENAI_MODEL = "gpt-4o-mini"
OPENAI_BASE_URL = "https://api.openai.com/v1"
ALLOWED_USER_IDS = ""               # e.g. "123456789,987654321" — empty = public bot
SESSION_TTL_SECONDS = "604800"      # 7 days

# Secrets (never commit them) — set with `wrangler secret put <NAME>` or via GitHub Actions:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, GEMINI_API_KEY, OPENAI_API_KEY
